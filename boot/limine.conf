# Sol OS — Limine boot configuration
#
# Format: limine.conf (Limine 8.x). If you pin a different Limine
# release, re-check this syntax — older releases (pre-v5) used
# limine.cfg with different keys entirely. See LIMINE_VERSION.md.

timeout: 3
default_entry: 1

/Sol OS
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
